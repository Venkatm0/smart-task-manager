<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>Smart Task Manager</h2>

    <div>

        <a href="/login">Login</a>

    </div>

</div>

<div class="container">

    <h1>Create Account</h1>

    <p>
        Register to start organizing your tasks.
    </p>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
