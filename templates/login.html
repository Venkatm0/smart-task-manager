<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>Smart Task Manager</h2>

    <div>

        <a href="/register">Register</a>

    </div>

</div>

<div class="container">

    <h1>Login</h1>

    <p>
        Login to manage your tasks and productivity.
    </p>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
