<!DOCTYPE html>
<html>
<head>

    <title>Update Task</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Update Task</h1>

<form method="POST">

    <input type="text"
           name="title"
           value="{{ task.title }}"
           required>

    <textarea name="description">{{ task.description }}</textarea>

    <select name="priority">

        <option {% if task.priority == 'High' %}selected{% endif %}>High</option>

        <option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>

        <option {% if task.priority == 'Low' %}selected{% endif %}>Low</option>

    </select>

    <select name="status">

        <option {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>

        <option {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>

    </select>

    <button type="submit">Update Task</button>

</form>

</div>

</body>
</html>
